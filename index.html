<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#246b58" />
    <meta
      name="description"
      content="Pet Rescue Blocks: jogo PWA mobile inspirado em Tetris com tema de resgate animal."
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="style.css?v=3" />
    <title>Pet Rescue Blocks</title>
  </head>
  <body>
    <main class="phone-frame" aria-label="Pet Rescue Blocks">
      <section class="game-card">
        <header class="game-header">
          <div>
            <p class="kicker">Pet Rescue</p>
            <h1>Blocks</h1>
          </div>
          <button class="install-button" id="installButton" type="button" hidden>Instalar</button>
        </header>

        <section class="score-strip" aria-label="Placar">
          <div>
            <span>Pontos</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>Recorde</span>
            <strong id="bestScore">0</strong>
          </div>
          <div>
            <span>Pets</span>
            <strong id="rescuedPets">0</strong>
          </div>
        </section>

        <section class="play-area">
          <canvas id="gameCanvas" width="300" height="600" aria-label="Tabuleiro do jogo"></canvas>
          <aside class="side-panel">
            <div class="next-box">
              <span>Proximo</span>
              <canvas id="nextCanvas" width="96" height="96" aria-label="Proxima peca"></canvas>
            </div>
            <div class="help-chip">Complete linhas para ajudar pets.</div>
          </aside>
          <div class="line-toast" id="lineToast" aria-live="polite">+1 pet ajudado</div>
        </section>

        <section class="controls" aria-label="Controles">
          <button id="leftButton" type="button" aria-label="Mover para esquerda">◀</button>
          <button id="rotateButton" type="button" aria-label="Girar">⟳</button>
          <button id="rightButton" type="button" aria-label="Mover para direita">▶</button>
          <button id="dropButton" type="button" aria-label="Descer rapido">▼</button>
        </section>

        <section class="actions" aria-label="Acoes do jogo">
          <button class="primary" id="startButton" type="button">Iniciar</button>
          <button id="pauseButton" type="button">Pausar</button>
          <button id="restartButton" type="button">Reiniciar</button>
        </section>
      </section>

      <aside class="banner-ad" aria-label="Espaco para anuncio banner">
        Banner 320x50
      </aside>

      <section class="overlay" id="startOverlay">
        <div class="modal">
          <p class="kicker">Mobile PWA</p>
          <h2>Pet Rescue Blocks</h2>
          <p>Encaixe patinhas, ossos, coracoes, racao e casinhas. Cada linha completa ajuda um pet.</p>
          <button class="primary" id="playNowButton" type="button">Jogar agora</button>
        </div>
      </section>

      <section class="overlay" id="gameOverOverlay" hidden>
        <div class="modal">
          <p class="kicker">Game over</p>
          <h2 id="gameOverTitle">Fim de jogo</h2>
          <p id="gameOverText"></p>
          <div class="interstitial-ad" aria-label="Espaco para anuncio interstitial">
            Interstitial apos game over
          </div>
          <button class="primary" id="continueAdButton" type="button">Continuar vendo anuncio</button>
          <button id="tryAgainButton" type="button">Jogar de novo</button>
        </div>
      </section>
    </main>

    <script src="app.js?v=3" defer></script>
  </body>
</html>
